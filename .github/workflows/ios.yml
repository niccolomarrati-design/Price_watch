name: Build iOS App

on:
  push:
    branches: [ master, main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout codice
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Installa dipendenzes
      working-directory: ./price-watch-backend/price-watch-backend
      run: |
        npm install
        npm install @capacitor/core @capacitor/ios @capacitor/cli

    - name: Inizializza e Sincronizza Capacitor iOS
      working-directory: ./price-watch-backend/price-watch-backend
      run: |
        npx cap init "Price Watch" "com.pricewatch.app" --web-dir "src" || true
        npx cap add ios || true
        npx cap sync ios

    - name: Compila Progetto Xcode
      working-directory: ./price-watch-backend/price-watch-backend/ios/App
      run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -derivedDataPath build -sdk iphoneos CODE_SIGNING_ALLOWED=NO

    - name: Salva Pacchetto
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-files
        path: price-watch-backend/price-watch-backend/ios/App/build/Build/Products/Release-iphoneos/