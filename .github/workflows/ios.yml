name: Build iOS App

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # ─────────────────────────────────────────────
      # 1. Scarica il repository
      # ─────────────────────────────────────────────
      - name: Checkout codice
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. Configura Node.js
      # ─────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # ─────────────────────────────────────────────
      # 3. Installa dipendenze del progetto
      # ─────────────────────────────────────────────
      - name: Installa dipendenze NPM
        run: npm install

      # ─────────────────────────────────────────────
      # 4. Installa la piattaforma iOS di Capacitor
      # ─────────────────────────────────────────────
      - name: Installa Capacitor iOS
        run: |
          npm install @capacitor/ios
          npx cap add ios

      # ─────────────────────────────────────────────
      # 5. Sincronizza progetto web + plugin
      # ─────────────────────────────────────────────
      - name: Sincronizza Capacitor
        run: npx cap sync ios

      # ─────────────────────────────────────────────
      # 6. Installa CocoaPods
      # ─────────────────────────────────────────────
      - name: Installa dipendenze CocoaPods
        working-directory: ios/App
        run: pod install --repo-update

      # ─────────────────────────────────────────────
      # 7. Compila il progetto Xcode
      # ─────────────────────────────────────────────
      - name: Compila progetto iOS
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # ─────────────────────────────────────────────
      # 8. Salva il risultato della compilazione
      # ─────────────────────────────────────────────
      - name: Carica build iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ios/App/build/Build/Products/Release-iphoneos/