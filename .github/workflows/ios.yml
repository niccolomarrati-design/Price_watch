name: Build iOS App

on:
  push:
    branches: [ master, main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout codice
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Installa dipendenze
      working-directory: ./price-watch-backend/price-watch-backend
      run: |
        npm install
        npm install @capacitor/core @capacitor/ios @capacitor/cli

    - name: Prepara ambiente e inizializza Capacitor
      working-directory: ./price-watch-backend/price-watch-backend
      run: |
        mkdir -p src
        if [ ! -f "src/index.html" ]; then
          echo '<!DOCTYPE html><html><head><title>Price Watch</title></head><body><h1>Price Watch App</h1></body></html>' > src/index.html
        fi
        npx cap init "Price Watch" "com.pricewatch.app" --web-dir "src" || true

    - name: Aggiungi iOS e aggiorna Podfile
      working-directory: ./price-watch-backend/price-watch-backend
      run: |
        npx cap add ios || true
        
        # Sovrascrive la riga platform nel Podfile esistente impostando 14.0
        ruby -e '
          file = "ios/App/Podfile"
          lines = File.readlines(file)
          lines.map! { |line| line.start_with?("platform :ios") || line.start_with?("# platform :ios") ? "platform :ios, '\''14.0'\''\n" : line }
          File.open(file, "w") { |f| f.puts lines.join }
        '

    - name: Esegui Pod Install ed esegui Sync
      working-directory: ./price-watch-backend/price-watch-backend/ios/App
      run: |
        pod install
        cd ../..
        npx cap copy ios

    - name: Compila Progetto Xcode
      working-directory: ./price-watch-backend/price-watch-backend/ios/App
      run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -derivedDataPath build -sdk iphoneos CODE_SIGNING_ALLOWED=NO

    - name: Salva Pacchetto
      uses: actions/upload-artifact@v4
      with:
        name: ios-build-files
        path: price-watch-backend/price-watch-backend/ios/App/build/Build/Products/Release-iphoneos/