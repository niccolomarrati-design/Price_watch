name: Build iOS App

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:

      # 1. Scarica il repository
      - name: Checkout codice
        uses: actions/checkout@v4

      # 2. Configura Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: price-watch-capacitor/mnt/data/price-watch-capacitor/package-lock.json

      # 3. Copia il frontend aggiornato nella www di Capacitor
      - name: Aggiorna frontend web
        run: |
          rm -rf price-watch-capacitor/mnt/data/price-watch-capacitor/www/*
          cp -R price-watch-v2-cloudflare/price-watch-full/webapp/. \
            price-watch-capacitor/mnt/data/price-watch-capacitor/www/

      # 4. Entra nella vera root del progetto Capacitor
      - name: Installa dipendenze Capacitor
        working-directory: price-watch-capacitor/mnt/data/price-watch-capacitor
        run: npm ci

      # 5. Sincronizza Capacitor con iOS
      - name: Sincronizza Capacitor iOS
        working-directory: price-watch-capacitor/mnt/data/price-watch-capacitor
        run: npx cap sync ios

      # 7. Compila il progetto Xcode
      - name: Compila progetto iOS
        working-directory: price-watch-capacitor/mnt/data/price-watch-capacitor/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # 8. Salva il risultato della compilazione
      - name: Carica build iOS
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: price-watch-capacitor/mnt/data/price-watch-capacitor/ios/App/build/Build/Products/Release-iphoneos/